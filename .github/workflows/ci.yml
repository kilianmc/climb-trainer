name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # `vite build` rewrites the committed route tree, so a stale one is only visible as
      # a dirty tree after the build. Regeneration is deterministic, hence exit-code 0 on
      # an up-to-date file. `git diff --exit-code` also exits 0 on a pathspec that matches
      # NOTHING, so the file's existence is asserted first — otherwise a rename or a move
      # of this step out of the `web` job leaves the check passing forever.
      - run: git ls-files --error-unmatch src/routeTree.gen.ts
      - run: git diff --exit-code -- src/routeTree.gen.ts

  # NOTE: the job names `web`, `server` and `secrets` are required status checks in a
  # GitHub ruleset. RENAMING ONE SILENTLY BREAKS THE MERGE GATE — the rule then waits
  # forever for a check that no longer exists. Add steps freely; don't rename jobs.
  server:
    runs-on: ubuntu-latest

    # Real Postgres, not SQLite. The schema depends on native enums, text[],
    # GENERATED ... STORED, GIN and window functions, so a SQLite run would pass while
    # proving nothing. This is also the ONLY place the migrations get executed, since
    # the dev machine has no Postgres and no Docker.
    services:
      postgres:
        # Pinned to Neon's major version, so CI tests the server the app actually runs
        # against. Bump this when Neon's default major moves.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway container, never reachable externally
          POSTGRES_DB: climb_trainer_test
        ports:
          - 5432:5432
        # Without a health check, the first step races the server's startup and fails
        # roughly one run in five.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI has a single endpoint and no pooler, so DATABASE_URL_UNPOOLED is unset and
      # Alembic falls back to this. Against Neon, both must be set.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/climb_trainer_test
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # --frozen fails if uv.lock is stale, so the lockfile can never drift from
      # pyproject.toml unnoticed. Vercel installs from this same lock.
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # CI is where the migrations are proven. Nothing runs this automatically against
      # production — see the out-of-band migration rule in CLAUDE.md.
      - run: uv run alembic upgrade head
      # Catches model drift: a change to server/models.py with no matching revision.
      - run: uv run alembic check
      - run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks needs history to scan past commits
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
