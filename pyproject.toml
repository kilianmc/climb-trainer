[project]
name = "climb-trainer-server"
version = "0.0.0"
description = "climb-trainer API — versioning lives in the root package.json"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.19.1",
    # argon2id password hashing (server/auth/passwords.py). The reference implementation
    # of the algorithm OWASP recommends for new password storage.
    "argon2-cffi==25.1.0",
    # Pydantic's EmailStr is a no-op stub without it — it raises at model definition
    # time rather than validating, so this is a hard runtime dep, not an extra.
    "email-validator==2.3.0",
    # 0.141.x is the first line that allows starlette >= 1.0: FastAPI 0.128 pinned
    # `starlette<1.0.0`, so the six Dependabot alerts against starlette 0.52.1 could not
    # be closed without moving FastAPI too. See CLAUDE.md for what the 0.x -> 1.x jump
    # actually required (0.132's strict_content_type is the one that touches us).
    "fastapi==0.141.1",
    # psycopg3 (NOT asyncpg) — see server/db.py for why. The [binary] extra ships a
    # wheel with libpq bundled, so the Vercel Python image needs no system libpq.
    "psycopg[binary]==3.3.4",
    # HS256 access tokens (server/auth/tokens.py). Verification is stateless on purpose,
    # so it must never need the database.
    "pyjwt==2.13.0",
    # A runtime dep, not a dev one, on purpose: server/settings.py imports it, and a
    # dev-only dep would make production depend on the Vercel guard never regressing.
    "python-dotenv==1.2.3",
    "sqlalchemy==2.0.52",
]

# No requirements.txt, deliberately: if both exist, pyproject wins and the
# requirements file is silently ignored. Deps here + a committed uv.lock.

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.5",
    "uvicorn==0.52.4",
]

[tool.setuptools]
packages = [
    "server",
    "server.auth",
    "server.domain",
    "server.domain.planner",
    "server.library",
    "server.plans",
    "server.profile",
    "server.sessions",
    "server.vocabulary",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
# S101: pytest needs bare asserts. S105/S106: the auth tests contain obviously-fake
# passwords and hashes by necessity — flagging them would mean either silencing the rule
# line by line forever or, worse, making the fixtures look less fake.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106"] }

[tool.mypy]
python_version = "3.13"
strict = true
files = ["api", "server", "tests", "migrations"]
# SQLAlchemy 2 ships PEP 561 types. The old sqlalchemy2-stubs / mypy plugin is
# obsolete and actively wrong against `Mapped[...]` annotations — no plugin here.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
