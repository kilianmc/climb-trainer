[project]
name = "climb-trainer-server"
version = "0.0.0"
description = "climb-trainer API — versioning lives in the root package.json"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.128.8",
]

# No requirements.txt, deliberately: if both exist, pyproject wins and the
# requirements file is silently ignored. Deps here + a committed uv.lock.

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.1",
    "ruff==0.15.1",
    "uvicorn==0.39.0",
]

[tool.setuptools]
packages = ["server"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
# S101: pytest needs bare asserts.
per-file-ignores = { "tests/*" = ["S101"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
