name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # BUILD BEFORE TEST, deliberately (issue #26) — see CLAUDE.md, "Quality gate".
      - run: npm run build
      - run: npm run test
      # Two steps, and the existence one is not decoration — see CLAUDE.md,
      # "Routing: one tree, two histories".
      - run: git ls-files --error-unmatch src/routeTree.gen.ts
      - run: git diff --exit-code -- src/routeTree.gen.ts

  # ⚠️ Job names are required status checks — see CLAUDE.md, "Quality gate".
  server:
    runs-on: ubuntu-latest

    # See CLAUDE.md, "SQLite is disqualified for tests".
    services:
      postgres:
        # Pinned to Neon's major — see CLAUDE.md, "Local Postgres for the test suite".
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway container, never reachable externally
          POSTGRES_DB: climb_trainer_test
        ports:
          - 5432:5432
        # Without a health check, the first step races the server's startup and fails
        # roughly one run in five.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Unset DATABASE_URL_UNPOOLED, so Alembic falls back to this one — see CLAUDE.md,
      # "The other compute rules".
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/climb_trainer_test
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # `--frozen` — see CLAUDE.md, "Never add a `requirements.txt`".
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # CI is the only place these two run — see CLAUDE.md, "Migrations run out-of-band".
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      # `-rs` prints every skip reason, so a failure here names exactly what did not run;
      # `pipefail` so a genuine test failure is not swallowed by `tee`.
      - name: pytest — and assert nothing was skipped
        run: |
          set -o pipefail
          uv run pytest -q -rs | tee /tmp/pytest.log
          if grep -qE '[0-9]+ skipped' /tmp/pytest.log; then
            echo "::error::Tests were SKIPPED with DATABASE_URL set. The DB-backed suite is"\
                 "not running — check the alembic upgrade step and the postgres service."
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks needs history to scan past commits
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
