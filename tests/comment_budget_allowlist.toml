# Registered exceptions to the comment budget. Generated once as a BASELINE; every entry
# added after that is written by hand.
#
# `tests/test_comment_budget.py` is the reader. Read its module docstring before editing this
# file, and note that five arms there make a STALE entry a hard failure: an anchor that
# resolves to nothing, an anchor whose comment now fits its cap, an anchor matching more than
# one comment, a reason under 40 characters, and the ratchet on how many BASELINE rows may
# remain. There is no way to keep a row here by doing nothing.
#
# `anchor` is never a line number. Docstrings anchor on the dotted qualname; comment runs on a
# >=30-character normalised prefix of the run's own text. `limit` is a CEILING, not an
# equality — a typo fix must not turn the register red.
#
# Rows whose reason starts with BASELINE are the un-reviewed backlog. Deleting one by TRIMMING
# the comment is the intended way to interact with this file.

