; Alembic configuration.
;
; NOTE: there is deliberately NO `sqlalchemy.url` here. The URL is read from the
; environment in migrations/env.py (DATABASE_URL_UNPOOLED, falling back to
; DATABASE_URL) — this repo is public, so a connection string must never be able to
; land in a committed file.

[alembic]
script_location = migrations
; So `alembic` can import `server.*` when run from the repo root.
prepend_sys_path = .
; `os` = use the OS path separator for multiple version paths (the modern default;
; the legacy space-separated behaviour is deprecated).
version_path_separator = os
; Migrations are reviewed as code, so give the files readable names.
file_template = %%(rev)s_%%(slug)s
; Timestamps in migrations are UTC. Naive local time in a filename or a revision is
; how two branches end up looking simultaneous.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
