# Alembic runner — MANUAL ONLY. Actions -> Migrate -> Run workflow, or `gh workflow run
# migrate.yml`. The three inputs document themselves in the dispatch dialog below.
# PREREQUISITE: both GitHub environments (`dev`, `production`) must carry
# `DATABASE_URL_UNPOOLED` (the direct endpoint, which Alembic reads) and `DATABASE_URL` (the
# pooled one, which the two seed steps read) as environment secrets; without them the job
# starts and fails on the first Alembic step.
# THE POLICY AND THE THREE TRAPS are in CLAUDE.md, "How to actually run one" and "⚠️ Three
# traps, all paid for on the day it first ran" — who dispatches this and the approval gate,
# default-branch registration, environment-versus-ref, and why no step here uses `--verbose`.
name: Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which database to act on"
        type: choice
        required: true
        options: [dev, production]
      action:
        # ⚠️ No `downgrade` option, and the default is read-only — see CLAUDE.md,
        # "⚠️ Production data durability — real accounts, no undo".
        description: "current = read the applied revision · upgrade = run migrations · history = list revisions"
        type: choice
        required: true
        default: current
        options: [current, upgrade, history]
      seed:
        description: "After a successful upgrade, run `python -m server.seed` (idempotent upsert)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Two migration runs against the same database must never overlap. Queued, not
# cancelled: cancelling mid-DDL is how a half-applied migration happens.
concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Deliberately NOT named `web`, `server` or `secrets` — see CLAUDE.md, "Quality gate".
  migrate:
    runs-on: ubuntu-latest

    # Selects the GitHub environment, so `production`'s protection rules apply and each
    # environment carries its own connection secrets: a `dev` run cannot reach production's.
    environment: ${{ inputs.environment }}

    env:
      # Two endpoints, not interchangeable — see CLAUDE.md, "The other compute rules".
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # ⚠️ THE OPT-IN, and this workflow is the only sanctioned setter:
      # `server/db.py::require_migration_host` refuses a non-local host without it.
      CT_ALLOW_REMOTE_MIGRATION: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # No `--all-groups`: a migration run has no use for pytest, ruff or mypy. For
      # `--frozen`, see CLAUDE.md, "Never add a `requirements.txt`".
      - run: uv sync --frozen

      # The "before" half of the audit trail; for `action: current` this is the whole job.
      # ⚠️ Bare `current`, never `--verbose` — CLAUDE.md's trap 3 is why.
      - name: Applied revision (before)
        run: uv run alembic current

      # `--verbose` is safe on `history` alone — same trap 3.
      - name: Revision history
        if: ${{ inputs.action == 'history' }}
        run: uv run alembic history --verbose

      - name: Upgrade to head
        if: ${{ inputs.action == 'upgrade' }}
        run: uv run alembic upgrade head

      # The "after" half. The pair is the only record of what this run moved.
      - name: Applied revision (after)
        if: ${{ inputs.action == 'upgrade' }}
        run: uv run alembic current

      # Two modules, in this order — see CLAUDE.md, "Migrations run out-of-band".
      - name: Seed reference data
        if: ${{ inputs.action == 'upgrade' && inputs.seed }}
        run: uv run python -m server.seed

      - name: Seed the exercise library
        if: ${{ inputs.action == 'upgrade' && inputs.seed }}
        run: uv run python -m server.contentseed
